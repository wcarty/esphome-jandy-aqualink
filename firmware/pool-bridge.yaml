# Complete example ESPHome configuration for Waveshare ESP32-S3-RS485-CAN
# wired directly to a Jandy AquaLink RS-8 Combo Pool & Spa panel.
#
# Hardware: https://www.waveshare.com/esp32-s3-rs485-can.htm
# Wiring:   A+ (Black) and B- (Yellow) only (isolated RS485 transceiver)
#
# Offline SCADA dashboard: copy firmware/pool-dashboard.css and
# firmware/pool-dashboard.js into /config/esphome/ (or use jsDelivr CDN URLs).

esphome:
  name: poolbridge
  friendly_name: PoolBridge

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Poolbridge Fallback Hotspot"

web_server:
  port: 80
  version: 3
  css_url: ""
  js_url: ""
  css_include: pool-dashboard.css
  js_include: pool-dashboard.js

external_components:
  - source: github://wcarty/esphome-jandy-aqualink@master
    components: [jandy_aqualink]
    refresh: 0s

time:
  - platform: homeassistant
    id: ha_time
    on_time:
      # Auto-sync Jandy clock daily at 3:05 AM (handles DST & drift)
      - seconds: 0
        minutes: 5
        hours: 3
        then:
          - lambda: |-
              auto now = id(ha_time).now();
              if (now.is_valid()) {
                id(jandy_comp).sync_time(now.year, now.month, now.day_of_month, now.hour, now.minute);
              }

jandy_aqualink:
  id: jandy_comp
  tx_pin: 17
  rx_pin: 18
  flow_control_pin: 21
  baud_rate: 9600
  keypad_address: 0x09
  ph_offset: 0.5
  orp_offset: 138
  acid_dosing_enabled: true
  aux6_status_byte: 2
  aux6_status_bit: 6

  pool_temp:
    name: "Pool Water Temp"
  spa_temp:
    name: "Spa Water Temp"
  air_temp:
    name: "Pool Air Temp"
  pump_rpm:
    name: "Pool Pump Speed"
  pump_watts:
    name: "Pool Pump Watts"
  ph:
    name: "Pool pH"
  orp:
    name: "Pool ORP"
  salt_level:
    name: "Pool Salt Level"
  salt_chlorinator_output:
    name: "Pool Salt Chlorinator Output"
  salt_chlorinator_generating:
    name: "Pool Salt Chlorinator Generating"
  salt_chlorinator_status:
    name: "Pool Salt Chlorinator Status"
  spa_mode:
    name: "Pool Spa Mode Status"
  filter_pump_state:
    name: "Pool Filter Pump Status"
  air_blower:
    name: "Pool Air Blower Status"
  booster_pump_state:
    name: "Spa Booster Pump Status"
  spillover_state:
    name: "Pool Spillover Status"
  cleaner_state:
    name: "Pool Light Status"
  acid_dosing_state:
    name: "Pool Acid Dosing Status"
  acid_dosing_status:
    name: "Pool Acid Controller State"
  checksum_errors:
    name: "Pool Bus Checksum Errors"
  polls_answered:
    name: "Pool Keypad Polls Answered"
  reply_latency:
    name: "Pool Keypad Reply Latency"

switch:
  - platform: template
    name: "Pool Master Control Interlock"
    id: pool_interlock
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: "id(jandy_comp).set_interlock(true);"
    turn_off_action:
      - lambda: "id(jandy_comp).set_interlock(false);"

  - platform: template
    name: "Pool Acid Auto Dosing"
    id: pool_acid_auto
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: "id(jandy_comp).set_acid_auto_enabled(true);"
    turn_off_action:
      - lambda: "id(jandy_comp).set_acid_auto_enabled(false);"

  - platform: template
    name: "Pool Filter Pump"
    id: pool_filter_pump
    lambda: "return id(jandy_comp).filter_pump_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).filter_pump_on()) id(jandy_comp).arm_key(0x02);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).filter_pump_on()) id(jandy_comp).arm_key(0x02);"

  - platform: template
    name: "Pool Spa Mode"
    id: pool_spa_mode
    lambda: "return id(jandy_comp).spa_mode_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).spa_mode_on()) id(jandy_comp).arm_key(0x01);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).spa_mode_on()) id(jandy_comp).arm_key(0x01);"

  - platform: template
    name: "Pool Heater"
    id: pool_heater
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: "id(jandy_comp).arm_key(0x12);"
    turn_off_action:
      - lambda: "id(jandy_comp).arm_key(0x12);"

  - platform: template
    name: "Spa Heater"
    id: spa_heater
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: "id(jandy_comp).arm_key(0x17);"
    turn_off_action:
      - lambda: "id(jandy_comp).arm_key(0x17);"

  - platform: template
    name: "Spa Booster Pump"
    id: spa_booster_pump
    lambda: "return id(jandy_comp).booster_pump_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).booster_pump_on()) id(jandy_comp).arm_key(0x06);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).booster_pump_on()) id(jandy_comp).arm_key(0x06);"

  - platform: template
    name: "Pool Air Blower"
    id: pool_air_blower
    lambda: "return id(jandy_comp).air_blower_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).air_blower_on()) id(jandy_comp).arm_key(0x0B);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).air_blower_on()) id(jandy_comp).arm_key(0x0B);"

  - platform: template
    name: "Pool Light"
    id: pool_light
    lambda: "return id(jandy_comp).cleaner_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).cleaner_on()) id(jandy_comp).arm_key(0x05);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).cleaner_on()) id(jandy_comp).arm_key(0x05);"

  - platform: template
    name: "Pool Color Wheel"
    id: pool_color_wheel
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: "id(jandy_comp).arm_key(0x0A);"
    turn_off_action:
      - lambda: "id(jandy_comp).arm_key(0x0A);"

  - platform: template
    name: "Pool Spillover Waterfall"
    id: pool_spillover_waterfall
    lambda: "return id(jandy_comp).spillover_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).spillover_on()) id(jandy_comp).arm_key(0x0F);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).spillover_on()) id(jandy_comp).arm_key(0x0F);"

  - platform: template
    name: "Pool Acid Dosing"
    id: pool_acid_dosing
    lambda: "return id(jandy_comp).acid_dosing_on();"
    turn_on_action:
      - lambda: "if (!id(jandy_comp).acid_dosing_on()) id(jandy_comp).arm_key(0x10);"
    turn_off_action:
      - lambda: "if (id(jandy_comp).acid_dosing_on()) id(jandy_comp).arm_key(0x10);"

  - platform: template
    name: "Pool Super Chlorinate"
    id: pool_super_chlorinate
    icon: "mdi:flash-alert"
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - lambda: "id(jandy_comp).set_swg_boost(true);"
    turn_off_action:
      - lambda: "id(jandy_comp).set_swg_boost(false);"

number:
  - platform: template
    name: "Pool Heat Setpoint"
    id: pool_heat_setpoint
    icon: "mdi:pool-thermometer"
    unit_of_measurement: "°F"
    mode: slider
    min_value: 45
    max_value: 90
    step: 1
    initial_value: 82
    restore_value: true
    optimistic: true
    set_action:
      - lambda: "id(jandy_comp).set_heater_setpoint(false, (uint16_t) x);"

  - platform: template
    name: "Spa Heat Setpoint"
    id: spa_heat_setpoint
    icon: "mdi:hot-tub"
    unit_of_measurement: "°F"
    mode: slider
    min_value: 80
    max_value: 104
    step: 1
    initial_value: 102
    restore_value: true
    optimistic: true
    set_action:
      - lambda: "id(jandy_comp).set_heater_setpoint(true, (uint16_t) x);"

  - platform: template
    name: "Pool Pump Speed Setpoint"
    id: pool_pump_speed_setpoint
    icon: "mdi:speedometer"
    unit_of_measurement: "RPM"
    mode: slider
    min_value: 600
    max_value: 3450
    step: 50
    initial_value: 2500
    restore_value: true
    optimistic: true
    set_action:
      - lambda: "id(jandy_comp).set_pump_rpm((uint16_t) x);"

  - platform: template
    name: "Pool Salt Chlorinator Setpoint"
    id: pool_swg_setpoint
    icon: "mdi:percent"
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 50
    restore_value: true
    optimistic: true
    set_action:
      - lambda: "id(jandy_comp).set_swg_percent((uint8_t) x);"

button:
  - platform: template
    name: "Pool Acid Emergency Stop"
    id: pool_acid_estop
    on_press:
      - lambda: "id(jandy_comp).acid_emergency_stop();"

  - platform: template
    name: "Sync Jandy Clock"
    id: sync_jandy_clock
    icon: "mdi:clock-sync"
    on_press:
      - lambda: |-
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            id(jandy_comp).sync_time(now.year, now.month, now.day_of_month, now.hour, now.minute);
          }
